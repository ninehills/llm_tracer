name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and Package Release Binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE="dist/stage-${GOOS}-${GOARCH}"
            mkdir -p "${STAGE}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${STAGE}/llm_tracer" .
            cp config.toml.example LICENSE THIRD_PARTY_LICENSES.md README.md "${STAGE}/"
            tar -C "${STAGE}" -czf "dist/llm_tracer-${VERSION}-${GOOS}-${GOARCH}.tar.gz" \
              llm_tracer config.toml.example LICENSE THIRD_PARTY_LICENSES.md README.md
            rm -rf "${STAGE}"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
